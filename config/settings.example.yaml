# config/settings.example.yaml
# Shipped TEMPLATE for OPYT. On first run, bootstrap copies this to
# ~/.opyt/settings.yaml. Edit your ~/.opyt/settings.yaml (NOT this template) to change
# model routing, sources, and cookies. Paths may use ~ — they are expanduser()'d when read.
#
# No API key belongs in this file. Keys live in ~/.opyt/.env, written by
# `opyt-keys --set NAME=VALUE` and read by pipeline/credentials.py::get_credential.
#
# There is no vault. The knowledge base is atoms in ~/.opyt/opyt.db, which creates itself on
# first use. A `vault.*` block (`vault_path`, `raw_path`) or a `pipeline:`/`processing:` block
# left in an existing settings.yaml is read as plain YAML and ignored. The fetch cap is
# `_FETCH_CAP` in pipeline/kb/ingest_x_footprint.py.

# Generic local-session cookie reads, currently Substack. They read your OWN logged-in browser
# session on THIS machine — nothing leaves your computer. X always uses OPYT's managed profile.
# Image reading during ingest (chart reads, pipeline/chart_read.py). Runs ONLY with an OpenRouter
# key: a free install (no key) never reads images, regardless of this toggle. With a key you can set
# `enabled: false` to save your own spend — images then stay decorative (undescribed) and are
# read on a later pass if you turn it back on. Missing or unreadable reads as enabled.
vision:
  enabled: true

cookies:
  # Which browser to read from. "auto" tries every installed browser in priority order
  # (Chrome → Brave → Edge → Vivaldi → Opera → Arc → Firefox → Safari) and uses whichever
  # holds a logged-in session. Set a specific key to pin one: chrome | brave | edge |
  # vivaldi | opera | arc | firefox | safari. $OPYT_BROWSER overrides this.
  # NOTE (macOS): generic Arc reads can prompt for Keychain access and Safari needs Full Disk
  # Access granted to your terminal/app. Generic Chromium reads and X's managed session do not
  # need a Keychain prompt.
  browser: auto
  # Which PROFILE of that browser to read. Each Chromium profile is its own cookie sandbox,
  # so a session in "Profile 1" is invisible from "Default". Unset means auto-pick when
  # exactly one profile is logged in. This affects generic readers, never X.
  profile:

# `sources:` (x/github/substack enable-flags, github username/topics, substack feeds) predates
# the atom-KB source model and has no reader left anywhere in pipeline/, opyt_core/ or
# mcp_server/. Which sources ingest for a given person is decided
# per-Oracle now (`add_oracle` / `oracle` action=confirm → `pipeline/kb/onboard_footprint.py`),
# gated by which credentials `pipeline/credentials.py` finds in ~/.opyt/.env — not by a global
# toggle here.

# Where the push rail uploads your export so other people can query it — the address of the service
# that hosts it, e.g. https://api.useopyt.com. Unset means you are not publishing: your knowledge
# base stays on this disk and only readers you hand the file to can read it. The TOKEN that proves
# you may publish there is a credential and lives in ~/.opyt/.env as OPYT_SERVICE_TOKEN
# (`opyt-keys --set OPYT_SERVICE_TOKEN=...`), never here.
#
# A READER sets nothing: they paste the invite link to their assistant, which calls `accept`, and
# the peer row it writes carries the full address.
service_url:

credible_people:
  # Archival roster of hand-curated X handles — NOT a live input. `add_oracle` (or `oracle`
  # action=confirm) is the current "add a person" path; it writes to the `oracles` table, and
  # nothing reads `profiles` as a roster. (One thing does read the key: first-run setup blanks it
  # so a new install does not inherit somebody else's list.) It is kept because an existing user's
  # hand-curated list is real data worth not silently dropping — not because anything acts on it.
  # List handles as `- username: somehandle` if you want them recorded here.
  profiles: []

# Routes every LLM call site through pipeline/llm_client.py. Each call site names
# a role; the role's provider+model is decided here. Generic defaults — no
# personal data. See llm_client.py for supported providers.
#
# Every role below has a live `role="..."` call site. Keep it that way: a role whose caller is
# gone misleads a new user, who reads this template to learn what OPYT does, and
# `model_routing.registered_models()` preflights every role listed here, so a dead role makes
# preflight assert health about models this install never touches. The same goes for plain keys:
# configuration exists only for a live caller.
llm_backends:
  default_provider: openrouter
  roles:
    vision:
      provider: openrouter
      model: google/gemma-4-31b-it
      max_tokens: 1024
