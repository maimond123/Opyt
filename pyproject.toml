# pyproject.toml — packaging so OPYT installs with a MACHINE-INDEPENDENT command.
#
# Before this, registering the MCP meant writing `<some-venv>/python <abs>/server.py` into
# each client's config — a path that only works on the author's machine. The console scripts
# below give every install stable commands on PATH (opyt-mcp / opyt-worker /
# opyt-install-client / opyt-keys), which is the foundation for distributing to a stranger.
#
# Two install modes both work:
#   - editable-from-clone: `pip install -e . --config-settings editable_mode=compat`
#   - self-contained artifacts: `python -m build` — bundles the Python packages below PLUS the
#     sanitized config template (settings.example.yaml) so a stranger needs no repo checkout.
#     config + mcp_server carry __init__.py so the flat layout ships as real packages, not
#     editable-only namespaces.
#     Never `pip wheel .` for a release: setuptools reuses a stale gitignored `build/lib/` and can
#     put deleted modules into the wheel. `python -m build` copies to a temp dir and builds the
#     wheel from the sdist, so `build/` cannot enter.
#
# Known v1 limitation: the flat layout installs generic top-level names (config, pipeline,
# mcp_server) — fine in a dedicated opyt venv/uvx env, but a src-layout refactor is the proper
# long-term fix.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opyt"
version = "0.1.0a8"
description = "A knowledge base that grows from your attention across the platforms you already use, served to your AI client over MCP."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "David Maimon" }]
keywords = ["mcp", "knowledge-base", "claude", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Topic :: Text Processing :: Indexing",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=3.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "cryptography<49; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "curl_cffi>=0.15.0",
    "trafilatura>=2.0.0",
    "html2text>=2024.2.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "htmldate>=1.8.0",
    "urllib3>=1.26.0",
    "lxml_html_clean>=0.4.0",
]

[project.optional-dependencies]
# The SERVER half — anything that answers HTTPS rather than stdio: `service/`, which hosts one
# person's export for another to query. fastapi + uvicorn serve it (websockets carries the X
# sign-in stream), and httpx makes its Google sign-in requests.
# Optional, and it must stay optional: installing OPYT to READ a knowledge base must never pull
# in a web framework to serve one. `service*` is absent from the packages-find list below, so it
# does not enter the client wheel — a server is deployed from a checkout with
# `pip install -e ".[server]"`.
server = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    # `service/pages/render.py` renders stored markdown into a page of sources.
    "markdown-it-py>=3.0.0",
    "uvicorn>=0.27.0",
    "websockets>=15.0.1",
]

test = [
    "pytest>=8.0",
    # `tests/service/` imports the FastAPI app.
    "opyt[server]",
]

[project.urls]
Homepage = "https://github.com/maimond123/Opyt"
Repository = "https://github.com/maimond123/Opyt"

[project.scripts]
opyt = "mcp_server.cli:main"
opyt-mcp = "mcp_server.server:main"
opyt-worker = "pipeline.worker.supervisor:main"
opyt-install-client = "opyt_core.install_client:main"
opyt-install-worker = "opyt_core.install_worker:main"
opyt-keys = "opyt_core.keys:main"


[tool.setuptools.packages.find]
include = ["opyt_core*", "mcp_server*", "pipeline*", "config"]

[tool.setuptools.package-data]
config = ["*.example.yaml", "*.example.json"]
